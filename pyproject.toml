[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tri9t-ai"
version = "0.1.0"
description = "Versioned PDF document hierarchy and QA idea generation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "PyMuPDF>=1.24",
  "pytesseract>=0.3.10",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

